eb"/><rect x="58" y="464" width="4" height="40" rx="2" fill="#167f87"/><text x="76" y="478" class="title" style="font-size:21px">04　工具落稿</text><text x="76" y="503" class="small">Registry / Draft Tool</text><text x="365" y="486" class="body">Guard 只放行教学草稿工具</text><text x="755" y="486" class="body">校验标题、格式、文件名和长度</text><text x="1145" y="486" class="body">按 Session / Call ID 幂等落盘</text><line x1="58" y1="517" x2="1542" y2="517" stroke="#dce4eb"/><rect x="58" y="534" width="4" height="40" rx="2" fill="#21815a"/><text x="76" y="548" class="title" style="font-size:21px">05　成果入库</text><text x="76" y="573" class="small">SessionFileLibrary</text><text x="365" y="556" class="body">自动物化文件并登记 Manifest</text><text x="755" y="556" class="body">按来源会话分组、预览与下载</text><text x="1145" y="556" class="body">受限 HTML 预览，隔离脚本网络</text><line x1="58" y1="587" x2="1542" y2="587" stroke="#dce4eb"/><rect x="58" y="604" width="4" height="40" rx="2" fill="#b84f79"/><text x="76" y="618" class="title" style="font-size:21px">06　教师审阅</text><text x="76" y="643" class="small">工作台 / BFF Approval</text><text x="365" y="626" class="body">人工核对目标、内容与可读性</text><text x="755" y="626" class="body">同一会话反馈，生成另一份草稿</text><text x="1145" y="626" class="body">确认当前版本，记录本地回执</text><line x1="58" y1="657" x2="1542" y2="657" stroke="#dce4eb"/><rect x="58" y="674" width="4" height="40" rx="2" fill="#526879"/><text x="76" y="688" class="title" style="font-size:21px">全程　执行保障</text><text x="76" y="713" class="small">Session / BFF</text><text x="365" y="696" class="body">事件持久化与产品状态投影</text><text x="755" y="696" class="body">重复命令防重，未知结果先对账</text><text x="1145" y="696" class="body">停止、10 分钟超时与重连恢复</text><line x1="58" y1="727" x2="1542" y2="727" stroke="#dce4eb"/><text x="58" y="772" class="label" style="fill:#b76a15">如何理解这页</text><text x="265" y="772" class="body">逐页内容、追问与人工审阅是本例的使用方式；页数与教学质量尚无专门的自动校验器</text><text x="265" y="808" class="body">修订会产生新的草稿；当前不承诺原文件自动升版、自动评分、PPTX 渲染或 ClassIn 发布</text><text x="58" y="856" class="small">后续 input:['教师与业务入口','教师工作台','教师先以自然语言提供目标、字段和必要信息；围绕课件生成、测验试卷生成开展任务。三个产品 Profile 分开使用各自会话空间。','怎样表达要求才足够？哪些缺失信息需要系统追问？当前不以真实业务 API 接入为前置条件。','src/features/agent-runtime/AgentRuntimeSurface.tsx'],
adapter:['TeachBuddy 自有 Module','Runtime Adapter 与本机 BFF','页面只调用稳定的 AgentRuntimeAdapter，由 HTTP Adapter 进入本机 BFF，再通过固定 HTTP RPC 调用官方 Harness。BFF 当前挂载在 Vite 开发与预览服务中。','当引擎升级或能力增加时，哪些产品契约应保持稳定？','src/contracts/workbuddy/agent-runtime.ts · server/teachbuddy-runtime.ts'],
control:['TeachBuddy 自有 Module','状态与控制','管理会话 scope、命令防重、输入队列对账、取消、超时与恢复。将官方事件映射为产品状态。浏览器当前以轮询读取结果；Profile 隔离不是生产账号授权。','遇到长会话、响应丢失或后台任务问题时，现有机制是否足够？再据此讨论基础设施。','server/teachbuddy-runtime.ts · server/harness-event-projection.ts'],

loop:['官方框架','Agent Loop','接收 Inbox 输入，组装一次模型请求，执行工具，再根据结果决定是否进入下一步。一轮任务可包含多次模型与工具调用。','哪些任务由一个 Agent 循环完成？何时需要明确流程或专业 Agent 分工？','vendor/deepseek-harness/packages/core/agent-loop/'],
model:['官方框架','模型接口','LLM Adapter 统一消息、流式输出与模型调用。模型决定生成内容及提出工具调用，工具能否执行由执行层约束。','如何根据课件与测验产物评价质量、时延和成本？怎样比较模型与推理策略？','vendor/deepseek-harness/packages/llm/'],

tools:['官方框架 + 本项目策略','工具 Registry 与 Guard','Registry 定义模型可调用工具；Guard 在执行时限制权限。当前 TeachBuddy 只允许 create_teaching_draft，不开放任意 Shell、文件或子 Agent 工具。','如何把一个业务能力封装为有明确输入、输出、失败语义和权限的工具？','runtime/harness/teaching-tools.mjs'],
draft:['TeachBuddy 插件','教学草稿生成','专用工具接收内容、名称和格式，校验并持久化 ArtifactDraft。课件和测验试卷是当前讨论的业务产物；现有文件格式为 Markdown、HTML、TXT、JSON，不据此宣称已有 PPTX 引擎。','产物应该包含哪些可校验结构？教师反馈如何形成质量标准与下一轮改进？','runtime/harness/teaching-tools.mjs'],
files:['TeachBuddy 自有 Module','成果文件库与本地审批','BFF 将生成草稿自动物化到 SessionFileLibrary，提供预览、下载和来源回链。自动入库不等待审批；教师确认保存另外形成本地 Action、Approval 和 Receipt。','如何管理产物版本与反馈？真实业务发布接入时，怎样保持留存、审批、发布各自清晰？','server/session-file-library.ts · src/contracts/workbuddy/session-files.ts'],

sources:['讨论底图 · 非新增实施计划','依据与边界','依据 2026-09-05 仓库架构盘点、官方固定版本源码与本轮用户反馈制作。本页呈现逻辑 Module 关系，不是逐进程部署图；文件物化和审批由 TeachBuddy BFF 协调。当前仅整理理解，不扩展产品能力。','后续按“行业案例 / 方法 / 论文 → 业务需求 → 适配与评价”逐模块展开。当前先用语言提供上下文，基础设施遇到实际问题再讨论。','docs/06-architecture/HARNESS-STRUCTURE-INVENTORY-2026-09-05.md · docs/01-research/DEEPSEEK-HARNESS-UPSTREAM-REVIEW-2026-09-05.md']};

let currentPage=0;
