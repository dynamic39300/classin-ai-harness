# rc2 rewrites roots on the original agent-presets row after CLI overlays.
- id: agent-presets
  disabled: true

- id: tools
  config:
    mode: native

- id: code-runtime
  disabled: true

- id: file-reference-local
  disabled: true

- id: webserver
  config:
    host: '127.0.0.1'
    port: 3080

- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: ask

- id: permission
  config:
    defaultPreset: read-only
    presets:
      read-only:
        sandbox: read-only
        approval: ask

- insert:
    - id: teachbuddy-agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: teachbuddy
        includeUserRoot: false
        roots:
          - path: !!js process.env.TEACHBUDDY_HARNESS_CONFIG_ROOT + '/presets'
            trust: system

    - id: teachbuddy-draft-tools
      # Names are literal and resolve from .runtime/harness-home/profiles/web.
      name: '../../../../runtime/harness/teaching-tools.mjs'

# Company gateway exposes Gemini through the OpenAI-compatible chat protocol.
- id: llm-pi-ai
  config:
    providers:
      company-gateway:
        displayName: Company Gateway
        api: openai-completions
        apiKeyEnv: DEEPSEEK_API_KEY
        baseURL: !!js process.env.TEACHBUDDY_GATEWAY_BASE_URL
        models:
          - id: gemini-2.5-pro
            name: Gemini 2.5 Pro
            input: [text, image]
            # Verified fallback while the 3.5 Flash route is capacity limited.
            contextWindow: 32768
            maxTokens: 4096
          - id: tokenhub/gemini-3.5-flash
            name: Gemini 3.5 Flash
            input: [text, image]
            # Conservative local budgets, not claims about gateway capacity.
            contextWindow: 32768
            maxTokens: 4096
